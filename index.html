{name:'🤝 설득하기',desc:'설득에 성공하면 이번 주 명령을 이행합니다.',action:()=>{const ok=Math.random()*100<clamp(46+o.trust*.45+(o.judgment-60)*.15,20,90);o.trust=clamp(o.trust+2,0,100);if(ok){o.acted='설득을 수용해 명령을 이행했습니다.';remember(o,'설득을 받아들였습니다.')}else{o.acted='설득이 실패해 이번 주 작전을 보류했습니다.';o.skip=true;remember(o,'설득에 응하지 않았습니다.')}dialogueNext()}},
{name:'⚠️ 경고하기',desc:'명령 이행 가능성이 높지만 충성도와 사기가 감소합니다.',action:()=>{o.loyalty=clamp(o.loyalty-8,0,100);o.morale=clamp(o.morale-5,0,100);if(Math.random()<.83){o.acted='경고 후 명령을 이행했습니다.';remember(o,'상관에게 경고받았습니다.')}else{o.acted='경고 후에도 명령을 거부했습니다.';o.skip=true;remember(o,'경고를 받았으나 명령을 거부했습니다.')}dialogueNext()}},
{name:'🧠 의견 수용하기',desc:'이번 주 공격을 취소하고 신뢰도를 높입니다.',action:()=>{o.trust=clamp(o.trust+8,0,100);o.loyalty=clamp(o.loyalty+3,0,100);o.skip=true;o.acted='지휘관 의견을 수용해 방어 태세를 유지했습니다.';remember(o,'사단장이 의견을 수용했습니다.');G.performance=clamp(G.performance-1,0,100);dialogueNext()}},
{name:'🎖️ 교체 요청하기',desc:'상부가 심사합니다. 이번 주 작전은 중단됩니다.',action:()=>{o.skip=true;const accepted=Math.random()*100<clamp(30+G.trust*.35-(o.judgment-60)*.35,15,82);if(accepted){const old=o.name;o.name=`${pick(['알렉스','요한','프란츠','마르코','파벨'])} ${pick(['슈타인','브라운','크라우스','하르트만'])}`;o.loyalty=70;o.trust=50;o.judgment=rnd(47,81);o.trait=pick(['충성형','공격형','신중형','독립형']);o.acted=`${old} 대령이 교체되고 새로운 연대장이 부임했습니다.`;remember(o,'새로운 연대장으로 부임했습니다.');log(`🎖️ 상부에서 ${old} 대령의 교체 요청을 승인했습니다.`)}else{o.acted='상부에서 지휘관 교체 요청을 거절했습니다.';G.trust=clamp(G.trust-3,0,100);remember(o,'상부에서 교체 요청을 기각했습니다.');log(`📨 상부에서 ${o.unit} 지휘관 교체 요청을 거절했습니다.`)}dialogueNext()}}
])}
function validSupport(t,key){if(t.order==='defend'||t.target===null)return false;if(key==='planes'){if(R[t.pos].neighbors.includes(t.target))return true;return R[t.pos].neighbors.some(n=>R[n].neighbors.includes(t.target))}return R[t.pos].neighbors.includes(t.target)}
function resolveWeek(){let lines=[],battles=0;const oldOwners=G.regions.map(r=>r.owner);const supports={};for(const key of ['tanks','planes','ships']){const t=G[key];if(!validSupport(t,key)||t.count<=0)continue;if(t.order==='move'){if((key==='tanks'||key==='planes')&&G.regions[t.target].owner!==G.player){lines.push('전차와 전투기는 점령되지 않은 지역으로 단독 배치할 수 없습니다.');continue}if(key==='ships'&&G.regions[t.target].owner!==G.player){lines.push('군함은 적 해안으로 직접 주둔할 수 없어 현재 위치에서 지원 임무만 가능합니다.');continue}t.pos=t.target;lines.push(`${key==='tanks'?'🚜 전차':key==='planes'?'✈️ 전투기':'🚢 군함'}이(가) ${rname(t.pos)} 방면으로 이동했습니다.`)}else if(t.order==='support'){supports[key]=t.target}}
const groups={};for(const o of G.officers){if(o.skip){delete o.skip;lines.push(`${o.unit}: ${o.acted}`);continue}if(o.troops<100){o.acted='병력이 부족해 이동할 수 없었습니다.';lines.push(`${o.unit}: 병력이 부족합니다.`);continue}if(o.order==='move'&&eligible(o)){o.pos=o.target;o.acted=`${rname(o.pos)} 지역으로 이동했습니다.`;lines.push(`${o.unit}: ${rname(o.pos)} 지역으로 이동했습니다.`)}else if(o.order==='attack'&&eligible(o)){(groups[o.target]??=[]).push(o)}else{o.acted=o.acted||'지정 위치에서 방어 태세를 유지했습니다.'}}
for(const [targetString,attacking] of Object.entries(groups)){const target=Number(targetString),tile=G.regions[target],enemy=tile.owner;setWar(G.player,enemy);const troops=attacking.reduce((s,o)=>s+o.troops,0);let power=troops;let bonus=[];if(supports.tanks===target){power+=G.tanks.count*20*(ten(R[target].terrain)>18?.6:1.3);bonus.push('전차')}if(supports.planes===target){power*=1.15;bonus.push('항공')}if(supports.ships===target){power*=1.1;bonus.push('함포')}const defense=tile.defense*(1+ten(R[target].terrain)/100);let chance=clamp(Math.round(100*power/(power+defense)),14,88);const win=Math.random()*100<chance;battles++;for(const o of attacking){const loss=Math.min(o.troops,Math.round(o.troops*(win?rnd(8,19):rnd(15,30))/100));o.troops-=loss;o.morale=clamp(o.morale+(win?3:-6),0,100);o.acted=`${rname(target)} ${win?'공격에 성공했습니다.':'공격에 실패했습니다.'} 피해 ${fmt(loss)}명`;remember(o,`${rname(target)} 전투 ${win?'승리':'패배'}`);}
if(win){const lost=Math.round(tile.defense*.4);tile.defense=Math.max(500,tile.defense-lost);tile.owner=G.player;G.captured++;G.nationalCap+=20000;G.officers.forEach(o=>{o.max+=650});attacking.forEach(o=>{o.pos=target});lines.push(`✅ ${rname(target)} 점령에 성공했습니다! 승률 ${chance}% · ${attacking.length}개 연대 투입${bonus.length?' · '+bonus.join('·')+' 지원':''}`);G.performance=clamp(G.performance+7,0,100);G.trust=clamp(G.trust+3,0,100)}else{tile.defense=Math.max(350,Math.round(tile.defense*.77));lines.push(`❌ ${rname(target)} 공격에 실패했습니다. 예상 승률 ${chance}% · 적 방어 병력이 남아 있습니다.`);G.performance=clamp(G.performance-3,0,100)}if(supports.tanks===target){const t=G.tanks;const loss=Math.min(t.count,rnd(2,11));t.count-=loss;lines.push(`🚜 전차 ${loss}대가 손실되었습니다.`)}if(supports.planes===target){const t=G.planes;const loss=Math.min(t.count,rnd(1,7));t.count-=loss;lines.push(`✈️ 항공기 ${loss}대가 손실되었습니다.`)}if(supports.ships===target&&Math.random()<.35){G.ships.count=Math.max(0,G.ships.count-1);lines.push('🚢 해상 지원 중 군함 1척이 손실되었습니다.')}}
// limited, local AI counterattack: automatically recalculated even during defensive week
for(const o of G.officers){if(G.regions[o.pos].owner!==G.player)continue;const hostile=R[o.pos].neighbors.filter(id=>G.regions[id].owner!==G.player&&atWar(G.player,G.regions[id].owner));if(hostile.length&&Math.random()<.16){let attack=pick(hostile),e=G.regions[attack];const fortified=o.order==='defend';let odds=clamp(.30+(e.defense-o.troops)/12000-(fortified?.16:0),.10,.62);let lost=Math.min(o.troops,rnd(100,Math.max(200,Math.round(o.troops*(fortified?.06:.12)))));o.troops-=lost;lines.push(`🛡️ ${o.unit}: ${rname(o.pos)}에서 적의 반격을 방어했습니다. 아군 피해 ${fmt(lost)}명.`);if(Math.random()<odds&&o.troops<850){G.regions[o.pos].owner=e.owner;lines.push(`⚠️ ${rname(o.pos)} 방어선이 돌파되었습니다.`);const retreat=R[o.pos].neighbors.find(j=>G.regions[j].owner===G.player);if(retreat!==undefined)o.pos=retreat;else G.fail++;}}}
// recovering is by weekly 1.25% of each formation cap, with no production buttons
for(const o of G.officers){if(o.troops>0){const heal=Math.min(o.max-o.troops,Math.ceil(o.max*.0125));o.troops+=heal;}o.order='defend';o.target=null}for(const k of ['tanks','planes','ships']){const u=G[k],inc=Math.max(1,Math.round(u.max*.0125));if(u.count>0)u.count=Math.min(u.max,u.count+inc);u.order='defend';u.target=null}
if(battles===0&&lines.length===0)lines.push('지정된 지역에서 방어 작전을 수행했습니다.');
G.week++;let goalDone=G.goal.kind==='capture'&&G.regions[G.goal.region].owner===G.player||G.goal.kind==='move'&&G.officers.some(o=>o.pos===G.goal.region);if(goalDone){G.completed++;G.trust=clamp(G.trust+9,0,100);G.performance=clamp(G.performance+6,0,100);lines.push(`🏅 상부 작전 목표 ${rname(G.goal.region)} 달성! 상부 신뢰도 상승.`);log(`🏅 ${rname(G.goal.region)} 작전 목표 달성`);issueGoal()}else if(G.week>=G.goal.deadline){G.trust=clamp(G.trust-9,0,100);G.performance=clamp(G.performance-5,0,100);lines.push('⚠️ 상부가 작전 지연을 지적했습니다. 신뢰도가 하락했습니다.');log('⚠️ 작전 기한을 지키지 못했습니다.');issueGoal()}
if(G.week%12===0){if(G.trust>=70&&G.performance>=70&&G.rank<3&&Math.random()<.85){G.rank++;G.officers.forEach(o=>{o.max+=1000;o.troops+=350});lines.push('🎖️ 진급 심사에 통과했습니다! 새로운 지휘 보직에 부임했습니다. 휘하 병력 지휘 한도가 확대됩니다.');log(`🎖️ ${['사단장','군단장','야전군 사령관','집단군 사령관'][G.rank]}으로 진급했습니다.`)}else{lines.push('📋 인사 심사 결과: 현재 보직을 유지합니다.');log('📋 이번 인사 심사에서는 진급하지 못했습니다.')}}
if(G.trust<=15){lines.push('⚠️ 상부가 지휘권 회수를 검토하고 있습니다.');if(G.trust<5)G.won='dismissed'}
const summary=`${dWeek(G.week)} 작전 보고`;for(const t of lines.slice(0,8))log(t);save();render();phase='idle';let body=lines.map(x=>`<div class="report">${esc(x)}</div>`).join('');if(G.won==='dismissed'){body+='<div class="notice">상부 신뢰를 완전히 잃어 보직에서 해임되었습니다. 새 게임으로 도전할 수 있습니다.</div>'}modal(summary,body,[{name:'보고를 확인했습니다.',action:()=>{}}]);}
function setup(){const buttons=['de','pl','fr','uk','su','it','be','fi'];const featured=$('featured');for(const id of buttons){let c=byId[id],b=document.createElement('button');b.className='country';b.dataset.c=id;b.innerHTML=`<strong>${c.flag} ${c.name}</strong><small>지역 ${R.filter(r=>r.country===id).length}개 · 사단장으로 시작</small>`;b.onclick=()=>{document.querySelectorAll('.country').forEach(t=>t.classList.remove('selected'));b.classList.add('selected');$('allCountries').value=id};featured.append(b)}for(const c of C){const opt=document.createElement('option');opt.value=c.id;opt.textContent=`${c.flag} ${c.name}`;$('allCountries').append(opt)}$('allCountries').value='de';featured.querySelector('[data-c="de"]').classList.add('selected');$('allCountries').onchange=()=>{document.querySelectorAll('.country').forEach(b=>b.classList.toggle('selected',b.dataset.c===$('allCountries').value))};$('startGame').onclick=()=>init($('allCountries').value);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('nextBtn').onclick=beginWeek;$('saveBtn').onclick=()=>save(true);$('newBtn').onclick=()=>modal('새 게임 시작',`<p>현재 진행 상황은 새 게임을 시작하면 덮어쓰게 됩니다. 계속하시겠습니까?</p>`,[{name:'취소',action:()=>{}},{name:'새 게임 시작',danger:true,action:()=>{G=null;phase='idle';$('game').classList.add('hidden');$('start').classList.remove('hidden');$('continueBtn').style.display='none'}}]);$('zoomIn').onclick=()=>zoom(1.3);$('zoomOut').onclick=()=>zoom(1/1.3);$('zoomReset').onclick=()=>{cam={s:1,x:0,y:0};setCam()};$('zoomHome').onclick=()=>focus(G.officers[0].pos);setupMap();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===20&&saved?.officers?.length>=3&&saved?.regions?.length===60&&byId[saved.player]){$('continueBtn').style.display='block';$('continueBtn').onclick=()=>{G=saved;selectedRegion=G.officers[0].pos;phase='idle';$('start').classList.add('hidden');$('game').classList.remove('hidden');focus(selectedRegion);render()}}}catch(e){}}
