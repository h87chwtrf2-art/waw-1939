const $=x=>document.getElementById(x),R=DATA.regions,C=DATA.countries,Cby=Object.fromEntries(C.map(c=>[c.id,c]));const KEY='waw1939_chapters_v30';const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const fmt=n=>Math.round(n).toLocaleString('ko-KR');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S=null,step=0,mapPan={x:0,y:0,s:1};const officersNames=['카를 베버','에른스트 하르트만','요한 크라우스'];let drawingMap=false;

function save(){if(S)localStorage.setItem(KEY,JSON.stringify({S,step}));}function showModal(title,txt,btn='확인했습니다.'){const v=$('modal');v.classList.remove('hidden');v.innerHTML=`<div class="card"><h3>${esc(title)}</h3><p>${txt}</p><button class="primary" id="dismiss">${btn}</button></div>`;$('dismiss').onclick=()=>{v.classList.add('hidden');v.innerHTML=''}}
function seed(country){let home=R.filter(r=>r.country===country),capital=home.find(r=>r.capital)||home[0],base=rand(4000,5800);return {country,week:1,stage:0,area:capital.id,owners:R.map(r=>r.country),enemy:R.map(r=>r.country==='de'?8000:r.country==='pl'?6500:rand(2800,8500)),units:[0,1,2].map((v)=>({name:officersNames[v]+' 대령',unit:'제'+(v+1)+'연대',area:capital.id,troops:base+rand(-400,700),max:6000,loyal:rand(50,84),trust:rand(45,82),trait:['신중형','공격형','충성형'][v],order:'방어',target:capital.id,outcome:'대기'})),staff:[{name:'작전참모',rep:'우수함'},{name:'정보참모',rep:'평범함'},{name:'보급참모',rep:'신중함'}],upperTrust:65,performance:50,rank:0,goal:null,policy:null,special:null,selected:capital.id,dialogue:null,report:[],wins:0,totalLoss:0,completed:0,support:0,recon:0,relations:{},events:[],ending:false};}
function reachable(u){return R[u.area].neighbors.filter(i=>S.owners[i]!==S.country)}function ownedAdj(u){return R[u.area].neighbors.filter(i=>S.owners[i]===S.country)}function chooseGoal(){const candidates=[...new Set(S.units.flatMap(u=>reachable(u)))];const r=candidates.length?R[candidates[rand(0,candidates.length-1)]]:R.find(r=>S.owners[r.id]!==S.country);S.goal=r?.id??S.area;}
function start(c){S=seed(c);chooseGoal();step=0;save();render()}function readSave(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.S?.units?.length===3&&s.S.owners.length===60){S=s.S;step=s.step||0;return true}}catch(e){}return false}

function info(){return `<div class="card alt stat"><div class="row"><b>${Cby[S.country].flag} ${Cby[S.country].name} · ${['사단장','군단장','야전군 사령관','집단군 사령관'][S.rank]}</b><b class="value">병력 ${fmt(S.units.reduce((a,u)=>a+u.troops,0))}명</b></div><div class="row"><span>상부 평가: ${S.upperTrust>=70?'신뢰함':S.upperTrust>=40?'보통':'우려함'}</span><span>누적 작전 성공 ${S.completed}회</span></div></div>`}
function screenStart(){const featured=['de','pl','fr','uk','su','it','be','fi'];$('headline').textContent='국가를 선택해 주세요.';$('weekTag').textContent='시작';$('progress').innerHTML='';$('backBtn').classList.add('hidden');$('nextBtn').classList.add('hidden');$('main').innerHTML=`<div class="card"><h3>🎖️ 사단장으로 부임하기</h3><p>1939년 유럽에서 사단을 지휘하십시오. 1챕터는 1주일이며 참모회의부터 작전 보고까지 순서대로 진행됩니다.</p><div class="two">${featured.map(id=>`<button data-country="${id}" class="choice">${Cby[id].flag} ${Cby[id].name}</button>`).join('')}</div><p class="mini">다른 국가:</p><select id="countrySel" style="width:100%;padding:10px;background:#324f70;color:white;border-radius:9px">${C.map(x=>`<option value="${x.id}">${x.flag} ${x.name}</option>`).join('')}</select><button style="margin-top:10px;width:100%" class="primary" id="startButton">선택한 국가로 시작하기</button></div><div class="card mini">유럽 60개 지역·25개 국가를 사용하는 게임용 간략 지도입니다. 실제 역사적 국경과 병력 배치는 완전한 재현이 아닙니다.</div>`;let selected='de';$('countrySel').value='de';document.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{selected=b.dataset.country;$('countrySel').value=selected;document.querySelectorAll('[data-country]').forEach(x=>x.classList.toggle('selected',x===b))});$('startButton').onclick=()=>start($('countrySel').value);}
function opening(){let target=R[S.goal],c=Cby[S.country];return `<div class="card alt"><h3>📨 군단사령부 작전 명령</h3><p>사단장님, 이번 주에는 ${esc(target.name)} 방면의 전황을 확인하고 작전을 수행해 주십시오. 무리한 피해를 피하면서 목표를 달성하시기 바랍니다.</p></div><div class="card"><h3>📋 참모회의</h3><p>🗺️ <b>작전참모</b>: "신속히 행동하지 않으면 적의 방어가 강화될 수 있습니다."</p><p>🔭 <b>정보참모</b>: "정확한 적 병력은 확인되지 않았습니다. 정찰을 권고드립니다."</p><p>📦 <b>보급참모</b>: "현재 사단의 작전 지속은 가능하지만 대규모 공격은 신중해야 합니다."</p></div><div class="card"><h3>이번 주 작전 방침을 선택해 주세요.</h3>${btnChoice('attack','⚔️ 적극적인 공격','진격을 우선하지만 손실 위험이 커집니다.',S.policy)}${btnChoice('balanced','🛡️ 신중한 작전','정보와 병력 보존을 고려합니다.',S.policy)}${btnChoice('defend','🏰 방어 우선','방어에 집중하며 상부 목표가 늦어질 수 있습니다.',S.policy)}</div>`}
function specialScreen(){return `<div class="card"><h3>⭐ 이번 주 특별 행동</h3><p>한 주에 한 가지 특별 행동만 선택할 수 있습니다. 선택 결과는 뒤에 나오는 지도와 전투에 반영됩니다.</p>${btnChoice('recon','🔭 정찰 강화','적군 추정 병력의 오차가 줄어듭니다.',S.special)}${btnChoice('support','📦 상부 지원 요청','지원 승인 시 전투에 추가 전력이 배치됩니다.',S.special)}${btnChoice('talk','🎖️ 지휘관 면담','휘하 연대장과의 관계가 개선될 수 있습니다.',S.special)}</div>`}
function mapScreen(){const selected=R[S.selected];return `<div class="mapbox" id="mapbox"><svg id="svgMap" viewBox="0 0 1100 680"><rect width="1100" height="680" fill="#1a3d50"/><g id="mapGroup">${R.map(r=>`<polygon data-tile="${r.id}" class="region ${S.owners[r.id]===S.country?'own':''} ${r.id===S.selected?'mark':''}" points="${r.polygon.map(v=>v.join(',')).join(' ')}" fill="${Cby[S.owners[r.id]]?.color||'#666'}"/>`).join('')}${R.map(r=>`<text x="${r.x}" y="${r.y-3}" text-anchor="middle" class="flag">${Cby[S.owners[r.id]]?.flag||'🏳️'}</text><text class="markText" text-anchor="middle" x="${r.x}" y="${r.y+13}">${esc(r.name.length>6?r.name.slice(0,5):r.name)}</text>`).join('')}</g></svg><div class="mapInfo">지도에서 지역을 터치해 확인하세요. 확대: 두 손가락 / 이동: 한 손가락</div></div><div class="card alt"><div class="row"><b>${Cby[S.owners[selected.id]]?.flag} ${esc(selected.name)}</b><span class="mini">${esc(terrain(selected))}</span></div><div class="row"><span class="mini">방어 지형 보너스 +${bonus(selected)}%</span><span class="mini">${S.owners[selected.id]===S.country?'아군 영토':'타국 영토'}</span></div></div><div class="card"><h3>연대별 명령</h3><p class="mini">현재 주둔지와 인접한 지역으로만 이동하거나 공격할 수 있습니다.</p>${S.units.map((u,i)=>`<div class="unit"><div><b>${esc(u.unit)}</b><div class="mini">${fmt(u.troops)}명 · ${esc(R[u.area].name)}</div></div><select data-order="${i}"><option value="defend">방어</option><option value="attack">공격</option><option value="move">이동</option></select></div><select style="width:100%;padding:8px;margin-bottom:7px;background:#345370;color:white;border-radius:8px" data-target="${i}">${[u.area,...R[u.area].neighbors].map(id=>`<option value="${id}">${S.owners[id]===S.country?'🛡️':'⚔️'} ${Cby[S.owners[id]]?.flag} ${esc(R[id].name)}</option>`).join('')}</select>`).join('')}</div>`}
function reactionSetup(){S.dialogue=[];for(let i=0;i<3;i++){let u=S.units[i];u.outcome='명령 이행';let target=R[u.target];if(u.order==='defend'){u.outcome='방어 태세 유지';continue}let risky=u.order==='attack'&&S.enemy[target.id]>(u.troops*1.2);let p=clamp(.06+(risky?.24:0)+(u.trait==='신중형'?.08:0)+(100-u.loyal)*.002,0,.60);let r=Math.random();if(r<p){u.outcome=r<p*.4?'명령 지연':r<p*.85?'작전 수정':'명령 거부';S.dialogue.push(i)}else u.outcome='명령 이행';}S.dialogueIndex=0;S.dialogueDone={};}
function reactionScreen(){let pending=S.dialogue.filter(i=>!S.dialogueDone[i]);const units=S.units.map(u=>`<div class="unit"><div><b>${esc(u.unit)}</b><div class="mini">${esc(u.name)} · ${esc(u.trait)}</div></div><span class="badge">${u.outcome}</span></div>`).join('');if(!pending.length)return `<div class="card"><h3>🎖️ 명령 전달 결과</h3><p>연대장들에게 지시가 전달되었습니다. 특별한 이견이 없거나 모든 대응을 마쳤습니다.</p>${units}</div>`;let i=pending[0],u=S.units[i];return `<div class="card"><h3>⚠️ ${esc(u.unit)}의 이의 제기</h3><p><b>${esc(u.name)} · ${esc(u.trait)}</b></p><p>"사단장님, ${esc(R[u.target].name)} 방면의 작전 수행에 문제가 있습니다. 예상되는 피해가 커 명령 재검토를 요청드립니다."</p><p class="mini">현재 반응: ${esc(u.outcome)}</p></div><div class="card"><h3>어떻게 대응하시겠습니까?</h3>${btnChoice('persuade','🤝 작전의 필요성을 설명합니다.','이행을 설득하지만 반드시 성공하지는 않습니다.',null)}${btnChoice('warn','⚠️ 명령 이행을 요구합니다.','압박으로 이행 가능성이 높아지지만 관계가 악화될 수 있습니다.',null)}${btnChoice('accept','🧠 연대장의 의견을 수용합니다.','해당 연대의 작전을 취소하고 신뢰를 높입니다.',null)}${btnChoice('replace','🎖️ 상부에 교체를 요청합니다.','교체 승인이 필요하며 이번 주 작전은 보류됩니다.',null)}</div><div class="card mini">나머지 지휘관 대응: ${pending.length}건</div>`}
function chooseResponse(v){let i=S.dialogue.find(i=>!S.dialogueDone[i]);if(i===undefined)return;let u=S.units[i];if(v==='persuade'){u.trust=clamp(u.trust+3,0,100);u.outcome=Math.random()<.65?'설득 후 이행':'설득 실패 · 대기'}else if(v==='warn'){u.loyal=clamp(u.loyal-7,0,100);u.outcome=Math.random()<.83?'경고 후 이행':'경고 후에도 거부'}else if(v==='accept'){u.trust=clamp(u.trust+9,0,100);u.outcome='의견 수용 · 방어';u.order='defend'}else{u.outcome='교체 요청 · 방어';u.order='defend';if(Math.random()<.4){u.name=['마르틴 하인리히','오토 브라운','발터 슈타인'][rand(0,2)]+' 대령';u.loyal=rand(55,85)}else S.upperTrust=clamp(S.upperTrust-2,0,100)}S.dialogueDone[i]=true;save();render()}
function execute(){let report=[],wins=0,loss=0;const support=S.special==='support'&&Math.random()<.62;const grouped={};for(let u of S.units){if(u.order==='attack'&&['명령 이행','설득 후 이행','경고 후 이행'].includes(u.outcome)){if(!reachable(u).includes(u.target)){report.push(`${u.unit}: 공격 대상에 진입할 수 없어 방어 태세를 유지했습니다.`);continue}(grouped[u.target]??=[]).push(u)}else if(u.order==='move'&&['명령 이행','설득 후 이행','경고 후 이행'].includes(u.outcome)){if(ownedAdj(u).includes(u.target)) {u.area=u.target;report.push(`${u.unit}: ${R[u.area].name} 지역으로 이동했습니다.`)}else report.push(`${u.unit}: 이동 가능한 지역이 아닙니다.`)}else report.push(`${u.unit}: ${u.outcome==='대기'?'방어':u.outcome} 상태로 작전을 마쳤습니다.`)}
for(let [id,att] of Object.entries(grouped)){id=Number(id);const region=R[id],a=att.reduce((s,u)=>s+u.troops,0),defense=S.enemy[id]*(1+bonus(region)/100);let power=a*(S.policy==='attack'?1.12:S.policy==='defend'?.83:1)*(support?1.18:1);let odds=clamp(power/(power+defense),.12,.88);let win=Math.random()<odds;let enemies=S.owners[id];for(let u of att){let l=Math.round(u.troops*(win?(rand(8,18)/100):(rand(15,29)/100)));u.troops=Math.max(0,u.troops-l);loss+=l;if(win)u.area=id}S.enemy[id]=Math.max(500,Math.round(S.enemy[id]*(win?.45:.8)));if(win){S.owners[id]=S.country;wins++;S.wins++;S.performance=clamp(S.performance+7,0,100);report.push(`✅ ${Cby[enemies].flag} ${region.name} 점령에 성공했습니다. 공격군 손실은 ${fmt(loss)}명입니다.`)}else{S.performance=clamp(S.performance-4,0,100);report.push(`❌ ${region.name} 공격에 실패했습니다. 적군이 방어선을 유지했습니다.`)}}
let counter=0;for(let u of S.units){if(u.troops<100)continue;const enemies=R[u.area].neighbors.filter(j=>S.owners[j]!==S.country);if(enemies.length&&Math.random()<.22){let l=Math.min(u.troops,Math.round(u.troops*(u.order==='defend'?.035:.09)));u.troops-=l;loss+=l;counter++;report.push(`🛡️ ${u.unit}이(가) 적군의 반격을 방어했습니다. ${fmt(l)}명이 손실되었습니다.`)}}
for(let u of S.units){if(u.troops>0){const heal=Math.min(u.max-u.troops,Math.round(u.max*.0125));u.troops+=heal}u.order='방어';u.target=u.area}const goalDone=S.owners[S.goal]===S.country;if(goalDone){S.completed++;S.upperTrust=clamp(S.upperTrust+9,0,100);report.push('🏅 상부 작전 목표를 달성하여 신뢰가 상승했습니다.')}else{S.upperTrust=clamp(S.upperTrust-(S.policy==='defend'?4:1),0,100)}if(!wins&&!counter)report.push('이번 주에는 큰 전투 없이 작전이 종료되었습니다.');if(S.special==='recon')report.push('🔭 강화된 정찰로 적 병력의 추정 오차가 줄었습니다.');if(S.special==='support')report.push(support?'📦 상부가 요청한 지원을 승인했습니다.':'📦 상부가 지원 요청을 거절했습니다.');if(S.special==='talk'){S.units.forEach(u=>u.trust=clamp(u.trust+3,0,100));report.push('🎖️ 지휘관 면담으로 부하들과의 신뢰 관계가 개선되었습니다.')}if(loss>4000)S.upperTrust=clamp(S.upperTrust-3,0,100);S.totalLoss+=loss;
if(S.week%12===0&&S.upperTrust>=70&&S.performance>=70&&S.rank<3&&Math.random()<.65){S.rank++;report.push('🎖️ 인사 심사에 통과하여 상위 지휘 보직으로 진급했습니다.')}else if(S.week%12===0)report.push('📋 인사 심사가 완료되었습니다. 현재 보직을 유지합니다.');if(S.upperTrust<10){S.ending=true;report.push('상부 신뢰도 저하로 보직 해임 심사 대상이 되었습니다.')}S.report=report;S.events.push({week:S.week,report:report.slice(0,5)});S.events=S.events.slice(-8);save()}
function reportScreen(){return `<div class="card"><h3>⚔️ 제${S.week}주 작전 결과</h3>${S.report.map(x=>`<p class="q">${esc(x)}</p>`).join('')}</div><div class="card alt"><h3>📨 주간 인사 평가</h3><p>상부 신뢰: <b>${S.upperTrust>=70?'긍정적':S.upperTrust>=40?'보통':'우려'}</b> · 작전 성과: <b>${S.performance>=70?'우수':S.performance>=40?'보통':'개선 필요'}</b></p><p>누적 전투 손실: ${fmt(S.totalLoss)}명 · 작전 목표 달성: ${S.completed}회</p></div>`}
function render(){if(!S)return screenStart();$('headline').textContent=`${step+1}. ${names[step]}`;$('weekTag').textContent=weekTxt();$('progress').innerHTML=names.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('');$('backBtn').classList.toggle('hidden',step===0||step===4);$('nextBtn').classList.remove('hidden');$('backBtn').disabled=step===3&&S.dialogue?.some(i=>!S.dialogueDone?.[i]);$('nextBtn').textContent=step===4?'다음 주 시작 ›':'다음 장면 ›';$('nextBtn').disabled=(step===0&&!S.policy)||(step===1&&!S.special)||(step===3&&S.dialogue?.some(i=>!S.dialogueDone?.[i]));$('main').innerHTML=info()+(step===0?opening():step===1?specialScreen():step===2?mapScreen():step===3?reactionScreen():reportScreen());$('main').scrollTop=0;
if(step===0)bindChoices(v=>S.policy=v);if(step===1)bindChoices(v=>S.special=v);if(step===2)setupMap();if(step===3)bindChoices(chooseResponse)}
function setupMap(){const svg=$('svgMap');svg.setAttribute('viewBox','0 0 1100 680');svg.querySelectorAll('[data-tile]').forEach(el=>el.onclick=()=>{S.selected=Number(el.dataset.tile);save();render()});document.querySelectorAll('[data-order]').forEach(el=>{const i=+el.dataset.order;el.value=S.units[i].order;el.onchange=()=>{S.units[i].order=el.value;const u=S.units[i];if(el.value==='defend')u.target=u.area;save();render()}});document.querySelectorAll('[data-target]').forEach(el=>{const i=+el.dataset.target;const u=S.units[i];el.value=String(u.target);el.onchange=()=>{u.target=+el.value;u.order=S.owners[u.target]===S.country?'move':'attack';save();render()}});
let moving=false,px=0,py=0;svg.addEventListener('touchstart',e=>{if(e.touches.length===1){moving=false;px=e.touches[0].clientX;py=e.touches[0].clientY}},{passive:true});svg.addEventListener('touchmove',e=>{if(e.touches.length===1){let x=e.touches[0].clientX,y=e.touches[0].clientY;if(Math.abs(x-px)+Math.abs(y-py)>4){moving=true;mapPan.x+= (x-px)*2.6/mapPan.s;mapPan.y+=(y-py)*2.6/mapPan.s;px=x;py=y;drawPan()}}},{passive:true});svg.addEventListener('wheel',e=>{e.preventDefault();mapPan.s=clamp(mapPan.s*(e.deltaY<0?1.15:.87),.75,3.3);drawPan()},{passive:false});svg.addEventListener('touchend',()=>{setTimeout(()=>moving=false,80)});drawPan()}
function drawPan(){const g=$('mapGroup');if(g)g.setAttribute('transform',`translate(${mapPan.x} ${mapPan.y}) scale(${mapPan.s})`)}
function advance(){if(!S)return;if(step===0){if(!S.policy)return;step=1}else if(step===1){if(!S.special)return;step=2}else if(step===2){reactionSetup();step=3}else if(step===3){if(S.dialogue.some(i=>!S.dialogueDone[i]))return;execute();step=4}else{S.week++;S.policy=null;S.special=null;S.dialogue=null;S.report=[];chooseGoal();step=0}save();render()}
$('nextBtn').onclick=advance;$('backBtn').onclick=()=>{if(step>0&&step<4){step--;save();render()}};if(readSave()){render()}else screenStart();
</script></body></html>
