function progressMission(report){
 const h=S.hq;if(!h)return;
 if(h.type==='withdraw'||h.type==='redeploy'){
  const dest=h.region;let moved=0;
  for(const u of S.units){if(u.pos===dest||u.order==='attack')continue;
   const prev={[u.pos]:null},q=[u.pos];let found=false;
   while(q.length&&!found){const x=q.shift();for(const n of R[x].neighbors){if(prev[n]!==undefined||S.owners[n]!==S.country)continue;prev[n]=x;if(n===dest){found=true;break}q.push(n)}}
   if(found){let step=dest;while(prev[step]!==u.pos&&prev[step]!==null)step=prev[step];u.pos=step;u.fatigue=clamp(u.fatigue+6,0,100);moved++}}
  if(moved)report.push(`🚚 ${divisionTitle()} 재배치: ${moved}개 연대가 ${name(dest)} 방면으로 이동했습니다.`);
  if(S.units.every(u=>u.pos===dest)){
   if(h.phase==='moving'){h.phase='building';h.defenseWeeks=0;report.push('📍 목적지 도착. 방어진지 구축을 시작합니다.')}
   else{h.defenseWeeks=(h.defenseWeeks||0)+1;if(h.defenseWeeks>=1){h.complete=true;S.completed++;S.trust=clamp(S.trust+4,0,100);report.push('✅ 사단 재배치와 방어선 구축 임무를 완료했습니다.');chooseGoal()}}
  }
 }else if(h.type==='hold'){
  const stationed=S.units.some(u=>u.pos===h.region&&u.men>250);
  if(stationed&&S.owners[h.region]===S.country)h.defenseWeeks=(h.defenseWeeks||0)+1;
  if(S.week>=h.expires){
   if(stationed&&S.owners[h.region]===S.country){S.completed++;S.trust=clamp(S.trust+4,0,100);report.push('✅ 지정된 기간 동안 주요 방어선을 유지했습니다.');}
   else{S.failed++;S.trust=clamp(S.trust-5,0,100);report.push('⚠️ 주요 방어선이 상실되어 임무를 달성하지 못했습니다.');}
   chooseGoal();
  }
 }
}

function countryBorderSvg(){
 // Detect internal edges that belong to provinces of the same original country.
 const output=[];
 const lineOn=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];return Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)<.3&&p[0]>=Math.min(a[0],b[0])-.5&&p[0]<=Math.max(a[0],b[0])+.5&&p[1]>=Math.min(a[1],b[1])-.5&&p[1]<=Math.max(a[1],b[1])+.5};
 for(const r of R){const pp=r.polygon;
  for(let i=0;i<pp.length;i++){const a=pp[i],b=pp[(i+1)%pp.length],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
   const internal=R.some(t=>t.id!==r.id&&t.country===r.country&&t.polygon.some((q,j)=>lineOn(mid,q,t.polygon[(j+1)%t.polygon.length])));
   if(!internal)output.push(`<path d="M${a[0]},${a[1]}L${b[0]},${b[1]}"/>`);
  }
 }
 return `<g class="v71NationBorders" pointer-events="none">${output.join('')}</g>`;
}

}

function renderAfterAction(){
 const r=S.afterAction||[];const significant=r.find(x=>x.exception);
 $('main').innerHTML=`<div class="scroll"><div class="card" style="padding:12px"><div class="counter">🎖️ 이번 주 교전 종료 · 연대장 사후 보고</div><h2 style="margin:6px 0">${esc(divisionTitle())} 전투 보고</h2><p class="small muted">각 연대의 손실, 병력 상태, 작전 결과를 확인하십시오.</p></div>${r.map(x=>`<div class="afterReg"><div class="row"><b>${esc(x.regiment)} · ${esc(x.name)} ${esc(x.rank)}</b><span class="tiny">${x.comms==='두절'?'📡 두절':x.loss>220?'⚠️ 피해 큼':'보고 완료'}</span></div><p>“사단장님, ${x.loss>220?'이번 전투에서 큰 손실을 입었습니다.':x.loss>0?'적군과 교전하여 일부 손실이 발생했습니다.':x.gain>0?'보충 병력이 도착했습니다.':'연대는 맡은 임무를 수행했습니다.'} 현재 ${esc(x.position)}에 주둔 중입니다.”</p><div class="row tiny"><span class="red">손실 −${fmt(x.loss)}명</span><span class="green">잔여 ${fmt(x.men)}명</span><span>사기 ${x.morale} · 피로 ${x.fatigue}</span></div></div>`).join('')}${significant?`<div class="card"><h3>사단장의 후속 조치</h3><p class="small muted">${esc(significant.regiment)}의 상황에 관한 결정입니다. 다음 주의 사기와 관계에 영향을 줍니다.</p><div class="missionChoices">${[['rest','후방에서 재정비하도록 지시'],['praise','연대장의 판단과 노고를 치하'],['question','지휘 판단에 대한 경위 보고 요구']].map(([k,label])=>`<button data-after="${k}" class="${S.afterDecision===k?'on':''}">${label}</button>`).join('')}</div></div>`:''}</div>`;
 document.querySelectorAll('[data-after]').forEach(b=>b.onclick=()=>{
  if(S.afterDecision)return;
  const u=S.units[significant.i],v=b.dataset.after;
  S.afterDecision=v;
  if(v==='rest'){u.fatigue=clamp(u.fatigue-10,0,100);u.morale=clamp(u.morale+4,0,100);u.memory.push('사단장의 재정비 지시');}
  if(v==='praise'){u.trust=clamp(u.trust+6,0,100);u.morale=clamp(u.morale+5,0,100);u.memory.push('사단장으로부터 치하');}
  if(v==='question'){u.trust=clamp(u.trust-4,0,100);S.performance=clamp(S.performance+1,0,100);u.memory.push('전투 경위 보고 요구');}
  S.monthLedger.events.push(`${u.regiment} 사후 조치: ${v}`);save();renderAfterAction();
 });
 $('next').textContent='🌍 세계 전황 보기 →';$('prev').classList.add('hidden');
}
function endWeek(){if(S.gameOver){finishCareer('dismissed');return}const lastKey=monthKey(weekDate(S.week));S.week++;if(monthKey(weekDate(S.week))!==lastKey){S.pendingMonth=true;S.monthLedger.endMen=totalMen();S.monthLedger.endMorale=avg('morale');S.monthLedger.endFatigue=avg('fatigue');S.monthlyRecords.push(JSON.parse(JSON.stringify(S.monthLedger)));S.monthlyRecords=S.monthlyRecords.slice(-24);S.stage=0}else{S.stage=0;pickEvent();updateWeather()}S.scenario=null;S.scenarioChoice=null;S.scenarioDone=false;S.v7Posture=null;S.v7Priority=null;S.v71Detail=null;S.v71Incidents=[];S.v71Situation=null;S.v7Crisis=null;S.v7CrisisChoice=null;S.v7CrisisResult=null;S.v72LastEnemy=null;S._mapCamera=null;save();render()}

function renderMonthly(){const m=S.monthLedger;$('pageTitle').textContent='📊 월간 결산';$('when').textContent=monthLabel(m.key);$('dots').innerHTML='';$('prev').classList.add('hidden');$('next').textContent='다음 달 시작 →';$('main').innerHTML=`<div class="scroll"><div class="card"><h2>${monthLabel(m.key)} 결산</h2><p class="muted small">${esc(S.playerName)} · ${flag(S.country)} ${esc(CO[S.country].name)} · ${['사단장','군단장','야전군 사령관','집단군 사령관'][S.rank]}</p><div class="statGrid"><div class="stat">월말 병력<big>${fmt(m.endMen)}명</big></div><div class="stat">전투 손실<big class="red">−${fmt(m.battleLoss)}명</big></div><div class="stat">보충 병력<big class="green">+${fmt(m.replacements)}명</big></div><div class="stat">점령 지역<big>${m.gained.length}곳</big></div></div><div class="summary"><div class="row"><span>월초 병력</span><b>${fmt(m.startMen)}명</b></div><div class="row"><span class="red">전투 손실</span><b class="red">−${fmt(m.battleLoss)}명</b></div><div class="row"><span class="green">보충 병력</span><b class="green">+${fmt(m.replacements)}명</b></div><hr style="border-color:#41536b"><div class="row"><b>월말 병력</b><b>${fmt(m.endMen)}명</b></div></div></div><div class="card"><h3>⚔️ 전투 성적</h3><div class="row"><span>승리 ${m.victories}회</span><span>패배 ${m.defeats}회</span><span>방어전 ${m.defenses}회</span></div><p class="small">확보 지역: ${m.gained.length?m.gained.map(esc).join(', '):'없음'}</p><h3>🪖 부대 상태</h3><div class="row"><span>사기 ${m.startMorale} → <b class="green">${m.endMorale}</b></span><span>피로 ${m.startFatigue} → <b class="yellow">${m.endFatigue}</b></span></div></div><div class="card"><h3>🤝 인근 사단 지원 현황</h3><p>이번 달 지원 파견: <b>${fmt(m.supportSent||0)}명</b> · 복귀: <b>${fmt(m.supportReturn||0)}명</b> · 파견 중 손실: <b>${fmt(m.supportLoss||0)}명</b></p><p class="small muted">현재 미복귀 파견 병력: ${fmt(S.awaySupport.reduce((n,a)=>n+a.remaining,0))}명</p></div><div class="card"><h3>🏅 지휘관 공적과 군율</h3><p>누적 특별 공적 ${S.merit||0}점 · 군율 위반 기록 ${S.discipline||0}</p></div><div class="card accent"><h3>🎖️ 군단사령부 월간 평가</h3><p>${m.victories>m.defeats?'이번 달 작전 수행 성과가 긍정적입니다. 다음 달에도 안정적으로 임무를 수행해 주십시오.':m.battleLoss>m.startMen*.15?'이번 달 병력 손실이 많았습니다. 다음 작전에서는 병력 보존에 유의해 주십시오.':'이번 달 작전 수행 상태를 확인했습니다. 다음 달에도 임무를 계속 수행해 주십시오.'}</p></div><div class="card"><h3>🌍 월간 세계 전황</h3><p class="small muted">${esc((S.worldLog||[]).slice(-4).flatMap(e=>e.lines).join(' · ')||'유럽 전체의 전황 변화가 보고되지 않았습니다.')}</p><button id="recordBtn" class="soft" style="width:100%">지난달 결산 기록 보기</button></div></div>`;$('recordBtn').onclick=()=>openModal('월간 결산 기록',S.monthlyRecords.map(r=>`<div class="resultline"><b>${monthLabel(r.key)}</b> · 병력 ${fmt(r.endMen)}명 · 승리 ${r.victories}회 · 손실 ${fmt(r.battleLoss)}명</div>`).join(''))}
function next(){
 if(!S)return;
 if(S.pendingMonth){S.pendingMonth=false;initMonth();S.stage=0;pickEvent();updateWeather();save();render();return}
 if(S.stage===0)S.stage=1;
 else if(S.stage===1){if(!S.hq.briefingAccepted){openModal('작전 명령 확인','<p>명령 수락 또는 상부와의 협의를 먼저 마쳐 주십시오.</p>');return}S.stage=2}
 else if(S.stage===2)S.stage=3;
 else if(S.stage===3)S.stage=5;
 else if(S.stage===5){if(!S.v7Posture||!v72Allowed(S.hq).includes(S.v7Posture)||!S.v7Priority||!S.v71Detail){openModal('작전 계획 미완료','<p>작전 방침과 지휘 우선순위를 선택해 주십시오.</p>');return}applyV7Plan();planV7Crisis();if(S.v7Crisis){S.stage=8}else{applyV71BeforeBattle();battle();S.stage=11}}
 else if(S.stage===8){if(!S.v7CrisisChoice){openModal('지휘 명령 필요','<p>위기 상황에 대한 사단장님의 지휘 명령을 선택하십시오.</p>');return}applyV7Crisis();applyV71BeforeBattle();battle();S.stage=11}
 else if(S.stage===11)S.stage=9;
 else if(S.stage===9){if(S._lastCombat)S.stage=12;else{worldWeekly();S.stage=10}}
 else if(S.stage===12){worldWeekly();S.stage=10}
 else if(S.stage===10){S.v7Posture=null;S.v7Priority=null;S.v71Detail=null;S.v71Incidents=[];S.v71Situation=null;S.v7Crisis=null;S.v7CrisisChoice=null;endWeek();return}
 save();render();
}
function previous(){if(!S||S.pendingMonth)return;if(S.stage===1)S.stage=0;else if(S.stage===2)S.stage=1;else if(S.stage===3)S.stage=2;else if(S.stage===5)S.stage=3;else return;render();save()}

function cinemaImage(key,caption){let src=CINEMA[key]||CINEMA.briefing;return `<div class="cinemaHero"><img src="${src}" alt="${caption}" loading="eager"><div class="cinemaCaption">${caption}</div></div>`}
function addCinematicArt(){
 const stage=S?.stage,root=document.getElementById('main');if(!root)return;
 if(!S){const sc=root.querySelector('.scroll');if(sc&&!sc.querySelector('.cinemaHero'))sc.insertAdjacentHTML('afterbegin',cinemaImage('cover','WORLD AT WAR · 지휘관 임명'));return}
 if(S.pendingMonth){const sc=root.querySelector('.scroll');if(sc&&!sc.querySelector('.cinemaHero'))sc.insertAdjacentHTML('afterbegin',cinemaImage('dispatch','월간 작전 결산'));return}
 if(stage===11)return;
 if(stage===0){const scene=root.querySelector('.dateScene');if(scene){scene.style.backgroundImage=`url("${CINEMA.cover}")`;}return}
 if(stage===2){const pic=root.querySelector('.speaker .symbol');if(pic){let key=['ops','intel','supply'][S.meetingIndex]||'ops';pic.outerHTML=`<img class="cinemaPortrait" src="${CINEMA[key]}" alt="${['작전참모','정보참모','보급참모'][S.meetingIndex]} 초상화">`;}return}
 const sc=root.querySelector('.scroll');
 if(sc&&!sc.querySelector('.cinemaHero')){
   let key='',cap='';
   if(stage===3){key='strategic';cap='전투 전 세부 작전 구역';}
   if(stage===4){const kind=S.scenario?.kind||S.emergency?.kind||'';
    key={battle:'attack',encircle:'retreat',officer:'regiment',staff:'briefing',hq:'dispatch',ally:'support',supply:'support',weather:'winter',signals:'signals',fire:'artillery',defense:'defense',morale:'medical',career:'commander',world:'strategic',civil:'city',aid:'support',counter:'counter',fatigue:'medical'}[kind]||'briefing';cap='전방 긴급 보고';}
   if(stage===5||stage===6){key='briefing';cap='연대별 작전 지휘';}
   if(stage===7){key='regiment';cap='연대장 명령 보고';}
   if(stage===8){key='attack';cap='전투 중 현장 보고';}
   if(stage===9){key=S.report?.some(x=>x.includes('승리')||x.includes('점령'))?'attack':'defense';cap='주간 작전 결과';}
   if(stage===10){key='strategic';cap='이번 주 유럽 전황';}
   if(key){sc.insertAdjacentHTML('afterbegin',cinemaImage(key,cap));}
 }
 if(stage===1){const paper=root.querySelector('.hqPaper');if(paper&&!paper.querySelector('.cinemaHero'))paper.insertAdjacentHTML('afterbegin',cinemaImage('dispatch','군단사령부 작전 명령'));}
 if(stage===4&&!sc){const card=root.querySelector('.meeting .card');if(card&&!card.querySelector('.cinemaHero'))card.insertAdjacentHTML('afterbegin',cinemaImage(S.scenario?.kind==='signals'?'signals':S.scenario?.kind==='ally'?'support':'briefing','긴급 상황 보고'));}
 if(stage===8&&!sc){const card=root.querySelector('.meeting .card');if(card&&!card.querySelector('.cinemaHero'))card.insertAdjacentHTML('afterbegin',cinemaImage('attack','전투 중간 보고'));}
}
function wrapCinematic(name){const original=window[name];if(typeof original!=='function')return;window[name]=function(...args){const r=original.apply(this,args);addCinematicArt();return r}}
['renderStart','renderDate','renderHQ','renderMeeting','renderTacticalOverview','renderStory','renderEmergency','renderReaction','renderMidBattle','renderReport','renderMonthly','renderWorldEnd'].forEach(wrapCinematic);
// preserve inner scroll when a regiment is selected or tactical option changes
const origRenderCircleCommands=window.renderCircleCommands;
window.renderCircleCommands=function(...args){let previous=document.querySelector('#main .scroll'),position=previous?.scrollTop||0;const r=origRenderCircleCommands.apply(this,args);addCinematicArt();const updated=document.querySelector('#main .scroll');if(updated)updated.scrollTop=position;return r};

// v5.2 persistent archive (separate from the active save).
const ARCHIVE_KEY='waw1939_war_archive_v1';
let archiveView='list';
function loadArchive(){try{const v=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function storeArchive(records){try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify(records.slice(0,40)));return true}catch(e){openModal('저장 실패','<p>브라우저 저장 공간에 접근하지 못했습니다. 비공개 브라우징 또는 저장 공간 부족을 확인해 주세요.</p>');return false}}
function runRecord(reason){
 const loss=(S.units||[]).reduce((n,u)=>n+(u.cumulativeLoss||0),0),wins=S.wins||0,losses=S.losses||0;
