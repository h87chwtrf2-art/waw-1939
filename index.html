<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2e"><meta name="apple-mobile-web-app-capable" content="yes"><title>WORLD AT WAR 1939</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c1525;color:#eaf1fa}main{max-width:640px;margin:auto;padding:18px 14px 40px}h1{font-size:25px;letter-spacing:1px;margin:4px 0}h2{font-size:17px;margin:8px 0}.sub{color:#a0b4cf;font-size:12px}.panel{background:#17263c;border:1px solid #344760;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.stat{background:#22334c;border-radius:9px;padding:10px}.stat small{display:block;color:#a5b9d0}.stat b{font-size:21px}button{border:0;border-radius:9px;padding:12px;background:#3476db;color:white;font-weight:700;font-size:14px;cursor:pointer}button:disabled{background:#45546b;color:#a3aec0}button.secondary{background:#293e59}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.region{min-height:78px;background:#6b3434;border:2px solid transparent;border-radius:9px;font-size:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:6px;text-align:center}.region.owned{background:#235d55}.region.selected{border-color:#f6ca62}.region small{color:#edf3f5;font-size:11px}.hidden{display:none}.country{display:flex;align-items:center;width:100%;text-align:left;gap:12px;background:#243852;margin:8px 0}.country span{font-size:30px}#log{font-size:13px;color:#b9cce1;line-height:1.5;max-height:140px;overflow:auto}#message{font-size:13px;color:#f6cf77;min-height:20px;margin:10px 0}.foot{font-size:11px;color:#8398b4;margin-top:15px}hr{border:0;border-top:1px solid #344760;margin:14px 0}</style></head><body><main><div class="sub">TURN-BASED GRAND STRATEGY · PROTOTYPE v0.1</div><h1>🌍 WORLD AT WAR <span style="color:#eec572">1939</span></h1><div class="sub">휴대폰 브라우저로 플레이하는 제2차 세계대전 전략 게임</div>
<section id="start" class="panel"><h2>국가를 선택하세요</h2><div class="sub">게임용 가상 전선 지도입니다. 역사적 경계와 다릅니다.</div><div id="nations"></div><p class="foot">목표: 1945년까지 지역 8곳 중 6곳 이상 통제. 매 턴 행동 2회.</p></section>
<section id="play" class="hidden"><div class="panel"><div class="row"><strong id="nationName"></strong><strong id="date"></strong></div><div class="stats"><div class="stat"><small>💰 국고</small><b id="gold"></b></div><div class="stat"><small>🏭 산업</small><b id="industry"></b></div><div class="stat"><small>🛡️ 병력</small><b id="army"></b></div><div class="stat"><small>🔬 기술</small><b id="tech"></b></div><div class="stat"><small>❤️ 사기</small><b id="morale"></b></div><div class="stat"><small>⚡ 행동</small><b id="ap"></b></div></div></div>
<div class="panel"><div class="row"><h2>전선 지도</h2><span class="sub" id="owned"></span></div><div class="map" id="map"></div><p class="sub">초록: 우리 지역 · 빨강: 적 지역. 공격할 빨간 지역을 누르세요.</p><div id="message"></div></div>
<div class="panel"><h2>국가 운영</h2><div class="buttons"><button onclick="act('recruit')" id="recruit">🛡️ 징병 · 40</button><button onclick="act('factory')" id="factory">🏭 공장 · 70</button><button onclick="act('research')" id="research">🔬 연구 · 55</button><button onclick="act('attack')" id="attack">⚔️ 지역 공격 · 25</button></div><hr><button style="width:100%" onclick="advance()">⏭ 다음 턴 진행</button><div class="buttons" style="margin-top:8px"><button class="secondary" onclick="save()">💾 저장</button><button class="secondary" onclick="resetGame()">↩ 새 게임</button></div></div><div class="panel"><h2>전황 보고</h2><div id="log"></div></div></section></main>
<script>
const nations=[{id:'de',name:'독일',flag:'🇩🇪',gold:120,army:9,industry:3,tech:2},{id:'uk',name:'영국',flag:'🇬🇧',gold:150,army:7,industry:4,tech:2},{id:'su',name:'소련',flag:'🇷🇺',gold:110,army:12,industry:3,tech:1},{id:'us',name:'미국',flag:'🇺🇸',gold:180,army:6,industry:5,tech:2},{id:'jp',name:'일본',flag:'🇯🇵',gold:120,army:9,industry:3,tech:2}];
const names=['서부 전선','북부 전선','중부 전선','동부 전선','남부 전선','해안 전선','산악 전선','수도 전선'];let s=null;let selection=2;
function start(id){const c=nations.find(n=>n.id===id);s={id,turn:0,gold:c.gold,army:c.army,industry:c.industry,tech:c.tech,morale:80,ap:2,regions:[true,true,false,false,false,false,false,false],logs:['1939년: '+c.name+' 지휘를 시작했습니다.'],ended:false};selection=2;save(false);render()}
function info(t){document.getElementById('message').textContent=t;if(s){s.logs.unshift(t);s.logs=s.logs.slice(0,20)}}
function act(action){if(!s||s.ended)return;if(s.ap<=0){info('행동력이 부족합니다. 다음 턴으로 이동하세요.');render();return;}let price={recruit:40,factory:70,research:55,attack:25}[action];if(s.gold<price){info('국고가 부족합니다.');render();return;}if(action==='attack'&&s.regions[selection]){info('적 지역을 먼저 선택하세요.');render();return;}s.gold-=price;s.ap--;if(action==='recruit'){s.army+=4;info('4개 부대 징집 완료.')}if(action==='factory'){s.industry++;info('군수공장 완공. 턴 수입 증가.')}if(action==='research'){s.tech++;info('군사 기술이 1단계 상승했습니다.')}if(action==='attack'){const power=s.army*2+s.tech*3+Math.floor(s.morale/20);const required=22+s.turn*2+selection*2;const loss=power>=required?1:3;s.army=Math.max(0,s.army-loss);if(power>=required){s.regions[selection]=true;s.morale=Math.min(100,s.morale+3);info(names[selection]+' 점령 성공! 병력 -'+loss);}else{s.morale=Math.max(0,s.morale-8);info(names[selection]+' 공격 실패! 병력 -'+loss+', 사기 -8.')}}check();save(false);render()}
function advance(){if(!s||s.ended)return;s.turn++;s.ap=2;const income=s.industry*20;s.gold+=income;let msg='산업 수입 +'+income+'. ';if(s.turn%2===0){const power=s.army*2+s.tech*3;const enemy=20+s.turn*2;if(power<enemy){s.army=Math.max(0,s.army-2);s.morale=Math.max(0,s.morale-5);msg+='적의 반격으로 병력 -2, 사기 -5.'}else msg+='적의 공세 방어 성공.'}info(msg);check();save(false);render()}
function check(){const owned=s.regions.filter(Boolean).length;if(owned>=6){s.ended=true;info('🏆 승리! 전략 지역 6곳을 확보했습니다.')}else if(s.army<=0||s.morale<=0){s.ended=true;info('💀 패배! 국가의 전쟁 수행 능력을 잃었습니다.')}else if(s.turn>=12){s.ended=true;info('💀 1945년 종료: 목표 지역을 확보하지 못했습니다.')}}
function save(show=true){if(s){try{localStorage.setItem('waw1939_v01',JSON.stringify(s));if(show){info('기기에 게임을 저장했습니다.');render()}}catch(e){if(show)info('저장 불가: 브라우저 저장 공간을 확인하세요.')}}}
function resetGame(){if(!confirm('현재 진행을 지우고 처음부터 시작할까요?'))return;s=null;localStorage.removeItem('waw1939_v01');render()}
function render(){document.getElementById('start').classList.toggle('hidden',!!s);document.getElementById('play').classList.toggle('hidden',!s);if(!s)return;let c=nations.find(n=>n.id===s.id);document.getElementById('nationName').textContent=c.flag+' '+c.name;document.getElementById('date').textContent=(1939+Math.floor(s.turn/2))+'년 '+(s.turn%2?'하반기':'상반기');for(let key of ['gold','industry','army','tech','morale','ap'])document.getElementById(key).textContent=s[key]+(key==='morale'?'%':'');document.getElementById('owned').textContent=s.regions.filter(Boolean).length+'/8 점령';document.getElementById('map').innerHTML=s.regions.map((v,i)=>`<button class="region ${v?'owned':''} ${selection===i?'selected':''}" onclick="selectRegion(${i})"><strong>${i+1}. ${names[i]}</strong><small>${v?'아군 통제':'적군 통제'}</small></button>`).join('');document.getElementById('log').innerHTML=s.logs.map(v=>'<p>'+v.replace(/</g,'&lt;')+'</p>').join('');for(let key of ['recruit','factory','research','attack'])document.getElementById(key).disabled=s.ended||s.ap<=0||s.gold<{recruit:40,factory:70,research:55,attack:25}[key];if(s.ended)document.getElementById('message').textContent=s.logs[0]+' 새 게임을 시작할 수 있습니다.'}
function selectRegion(i){selection=i;document.getElementById('message').textContent=s.regions[i]?names[i]+' — 아군 통제 중':names[i]+' — 공격 대상 선택됨';render()}
document.getElementById('nations').innerHTML=nations.map(n=>`<button class="country" onclick="start('${n.id}')"><span>${n.flag}</span><div><b>${n.name}</b><div class="sub">시작 병력 ${n.army} · 산업력 ${n.industry}</div></div></button>`).join('');try{let raw=localStorage.getItem('waw1939_v01');if(raw){let saved=JSON.parse(raw);if(saved&&Array.isArray(saved.regions)&&saved.regions.length===8)s=saved}}catch(e){}render();
</script></body></html>
