function setupTouch(){const el=$('mapArea');let start=null,base=null,pinchDist=0;el.onpointerdown=e=>{if(e.target.closest('button')||e.target.closest('#drawer'))return;el.setPointerCapture(e.pointerId);touch[e.pointerId]={x:e.clientX,y:e.clientY};start={x:e.clientX,y:e.clientY};base={...camera};touch.dragged=false};el.onpointermove=e=>{if(!touch[e.pointerId])return;touch[e.pointerId]={x:e.clientX,y:e.clientY};const pts=Object.values(touch);if(pts.length===1&&start){let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>7)touch.dragged=true;camera.x=base.x+dx;camera.y=base.y+dy;transformMap()}else if(pts.length===2){touch.dragged=true;let dst=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinchDist){let m=clamp(dst/pinchDist,.7,1.35);camera.scale=clamp(camera.scale*m,.25,8)}pinchDist=dst;transformMap()}};el.onpointerup=e=>{delete touch[e.pointerId];if(Object.keys(touch).length===0){pinchDist=0;S._mapCamera={mode:mapMode,camera:{...camera}};setTimeout(()=>touch.dragged=false,70)}};el.onpointercancel=e=>{delete touch[e.pointerId];pinchDist=0};}
function prepareDialogues(){S.dialogues=[];S.dialogueIndex=0;for(let i=0;i<3;i++){const u=S.units[i];u.reply='정상 이행';if(u.order==='defend')continue;const risky=u.order==='attack'&&S.enemies[u.target]>u.men*.85;const concern=u.fatigue>65||u.morale<43||risky;const chance=clamp(.035+(concern?.21:0)+(u.trait==='신중형'?.07:0)+(60-u.trust)/430,0,.5);if(Math.random()<chance){S.dialogues.push({unit:i,done:false,reason:u.fatigue>65?'연대의 피로도가 지나치게 높습니다.':risky?'적의 방어력이 예상보다 높아 피해가 우려됩니다.':'현장의 이동 여건이 좋지 않습니다.'});u.reply='이의 제기'}}}
function renderReaction(){const pending=S.dialogues.find(x=>!x.done);if(!pending){$('main').innerHTML=`<div class="scroll"><div class="card accent supply"><h2>🎖️ 연대장 명령 보고</h2><p>모든 연대장의 명령 확인이 완료되었습니다.</p></div>${S.units.map(u=>`<div class="card"><div class="row"><b>${esc(u.regiment)} · ${esc(u.name)}</b><span class="small">${esc(u.reply)}</span></div><p class="small muted">사기 ${u.morale} · 피로 ${u.fatigue} · 병력 ${fmt(u.men)}명</p></div>`).join('')}</div>`;$('next').textContent='작전 실행 →';return}
 const u=S.units[pending.unit];$('main').innerHTML=`<div class="meeting"><div class="card accent alert"><div class="speaker"><div class="symbol">🎖️</div><div><strong>${esc(u.name)}</strong><div class="small muted">${esc(u.regiment)} 연대장 · ${esc(u.trait)}</div></div></div><div class="speech">“사단장님, ${esc(pending.reason)} 작전의 재검토를 요청드립니다.”</div></div><div><button class="option" data-react="persuade">🤝 작전의 필요성을 설명합니다.</button><button class="option" data-react="warn">⚠️ 명령 이행을 요구합니다.</button><button class="option" data-react="accept">🛡️ 연대장의 의견을 수용합니다.</button><button class="option" data-react="replace">🎖️ 상부에 교체를 요청합니다.</button></div></div>`;document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>replyOfficer(b.dataset.react));$('next').textContent='응답을 선택해 주세요';}
function replyOfficer(type){const x=S.dialogues.find(x=>!x.done);if(!x)return;const u=S.units[x.unit];if(type==='persuade'){u.trust=clamp(u.trust+2,0,100);if(Math.random()<clamp(.38+u.trust/220,.3,.86))u.reply='설득 후 명령 이행';else{u.order='defend';u.target=u.pos;u.reply='설득 실패 · 방어 유지'}}else if(type==='warn'){u.trust=clamp(u.trust-7,0,100);u.morale=clamp(u.morale-4,0,100);if(Math.random()<.83)u.reply='경고 후 명령 이행';else{u.order='defend';u.target=u.pos;u.reply='명령 이행 보류'}}else if(type==='accept'){u.trust=clamp(u.trust+7,0,100);u.order='defend';u.target=u.pos;u.reply='의견 수용 · 방어 유지'}else{const ok=Math.random()<clamp(.15+S.trust/190,.15,.75);u.order='defend';u.target=u.pos;if(ok){u.name=one(['마르틴 하인리히','오토 브라운','알프레트 노박','헨리 윌슨']);u.trust=55;u.skill=random(45,86);u.reply='교체 승인 · 방어 유지'}else{S.trust=clamp(S.trust-3,0,100);u.reply='교체 거절 · 방어 유지'}}u.memory.push(u.reply);u.memory=u.memory.slice(-4);x.done=true;S.monthLedger.events.push(`${u.regiment}: ${u.reply}`);save();renderReaction()}
function battle(){const report=[],group={},ledger=S.monthLedger;let enemyCounter=0;for(const u of S.units){if(u.order==='move'&&R[u.pos].neighbors.includes(u.target)&&S.owners[u.target]===S.country){u.pos=u.target;u.fatigue=clamp(u.fatigue+random(11,21),0,100);report.push(`${u.regiment}이(가) ${name(u.pos)}로 이동했습니다.`)}else if(u.order==='attack'&&R[u.pos].neighbors.includes(u.target)&&S.owners[u.target]!==S.country){(group[u.target]??=[]).push(u)}else{u.fatigue=clamp(u.fatigue-random(12,24),0,100);u.morale=clamp(u.morale+random(0,3),0,100);report.push(`${u.regiment}은(는) 방어 태세를 유지했습니다.`)}}
 for(const [key,attackers] of Object.entries(group)){const id=Number(key),r=R[id],oldOwner=S.owners[id];const a=attackers.reduce((sum,u)=>sum+u.men*(.55+u.morale/160)*(1-u.fatigue/180),0),terrain=r.terrain.reduce((sum,[t,p])=>sum+({평야:0,숲:15,도시:20,산악:30}[t]||0)*p/100,0);const def=S.enemies[id]*(1+terrain/100),chance=clamp(a/(a+def),.12,.9),won=Math.random()<chance;let lossSum=0;
 for(const u of attackers){const loss=Math.min(u.men,Math.round(u.men*(won?random(7,16):random(13,28))/100));u.men-=loss;lossSum+=loss;u.fatigue=clamp(u.fatigue+random(18,31),0,100);u.morale=clamp(u.morale+(won?random(6,13):-random(8,15)),0,100);u.memory.push(`${r.name} 작전 ${won?'승리':'실패'}`);u.memory=u.memory.slice(-4);if(won)u.pos=id;}
 ledger.battleLoss+=lossSum;if(won){S.owners[id]=S.country;S.enemies[id]=Math.max(600,Math.round(S.enemies[id]*.42));ledger.victories++;S.wins++;ledger.gained.push(r.name);S.trust=clamp(S.trust+3,0,100);S.performance=clamp(S.performance+7,0,100);report.push(`✅ ${flag(oldOwner)} ${r.name} 점령에 성공했습니다. 아군 손실 ${fmt(lossSum)}명`)}else{ledger.defeats++;S.losses++;S.enemies[id]=Math.max(400,Math.round(S.enemies[id]*.78));S.performance=clamp(S.performance-4,0,100);report.push(`❌ ${r.name} 공격에 실패했습니다. 아군 손실 ${fmt(lossSum)}명`)}}
 for(const u of S.units){if(u.men<=0)continue;const border=R[u.pos].neighbors.filter(n=>S.owners[n]!==S.country);if(border.length&&Math.random()<.17){const hit=Math.min(u.men,Math.round(u.men*(u.order==='defend'?random(2,5):random(5,10))/100));u.men-=hit;u.morale=clamp(u.morale-random(2,8),0,100);u.fatigue=clamp(u.fatigue+random(6,14),0,100);ledger.battleLoss+=hit;ledger.defenses++;enemyCounter++;report.push(`🛡️ ${u.regiment}이(가) ${name(u.pos)}에서 반격을 방어했습니다. 피해 ${fmt(hit)}명`)}}
 let recovered=0;for(const u of S.units){if(u.men>0){let n=Math.min(u.max-u.men,Math.ceil(u.max*.0125));u.men+=n;recovered+=n}u.order='defend';u.target=u.pos}ledger.replacements+=recovered;report.push(`❤️ 보충 병력 ${fmt(recovered)}명이 배정되었습니다.`);
 const achieved=S.owners[S.goal]===S.country;if(achieved){S.completed++;S.trust=clamp(S.trust+6,0,100);report.push(`🏅 군단사령부의 ${name(S.goal)} 작전 목표를 달성했습니다.`);chooseGoal()}else if(S.week>=S.goalDue){S.failed++;S.trust=clamp(S.trust-6,0,100);report.push('⚠️ 작전 기한을 넘겨 상부의 평가가 하락했습니다.');chooseGoal()}
 if(S.week>0&&S.week%12===0){if(S.rank<3&&S.completed>=2&&S.trust>=72&&S.performance>=65&&Math.random()<.7){S.rank++;report.push(`🎖️ ${['사단장','군단장','야전군 사령관','집단군 사령관'][S.rank]} 보직에 발령받았습니다.`)}else report.push('📋 인사 평가 결과, 현재 보직을 유지합니다.')}
 if(!Object.keys(group).length&&!enemyCounter)report.push('이번 주에는 대규모 교전이 발생하지 않았습니다.');if(S.trust<=4){S.gameOver=true;report.push('상부에서 지휘권을 회수했습니다.')}S.report=report;S.history.unshift({week:S.week,report:[...report]});S.history=S.history.slice(0,36);save();}
function renderReport(){$('main').innerHTML=`<div class="scroll"><div class="card"><h2>⚔️ 주간 작전 결과</h2>${S.report.map(t=>`<div class="resultline ${t.startsWith('✅')?'green':t.startsWith('❌')?'red':''}">${esc(t)}</div>`).join('')}</div><div class="card"><h3>🪖 현재 부대 상태</h3>${S.units.map(u=>`<div class="summary"><div class="row"><b>${esc(u.regiment)}</b><b>${fmt(u.men)}명</b></div><div class="small">사기 <span class="green">${u.morale}</span> · 피로 <span class="yellow">${u.fatigue}</span></div></div>`).join('')}</div><div class="card"><h3>🎖️ 상부 평가</h3><p>상부 신뢰: <b>${S.trust>=70?'우수':S.trust>=40?'보통':'저조'}</b></p><p>누적 임무 달성: <b>${S.completed}회</b></p></div></div>`;$('prev').classList.add('hidden');$('next').textContent='다음 주 →'}
function endWeek(){if(S.gameOver){openModal('지휘권 회수','<p>상부에서 지휘권을 회수했습니다. 새 게임을 시작해 주세요.</p><button id="restartGame" class="primary">새 게임</button>');$('restartGame').onclick=()=>{localStorage.removeItem(KEY);S=null;$('modal').classList.add('hidden');render()};return}S.week++;if(S.week%4===0){S.pendingMonth=true;S.monthLedger.endMen=totalMen();S.monthLedger.endMorale=avg('morale');S.monthLedger.endFatigue=avg('fatigue');S.monthlyRecords.push(JSON.parse(JSON.stringify(S.monthLedger)));S.monthlyRecords=S.monthlyRecords.slice(-24);S.stage=0}else{S.stage=0;pickEvent()}S._mapCamera=null;save();render()}
function renderMonthly(){const m=S.monthLedger;$('pageTitle').textContent='📊 월간 결산';$('when').textContent=monthLabel(m.key);$('dots').innerHTML='';$('prev').classList.add('hidden');$('next').textContent='다음 달 시작 →';$('main').innerHTML=`<div class="scroll"><div class="card"><h2>${monthLabel(m.key)} 결산</h2><p class="muted small">${flag(S.country)} ${esc(CO[S.country].name)} · ${['사단장','군단장','야전군 사령관','집단군 사령관'][S.rank]}</p><div class="statGrid"><div class="stat">월말 병력<big>${fmt(m.endMen)}명</big></div><div class="stat">전투 손실<big class="red">−${fmt(m.battleLoss)}명</big></div><div class="stat">보충 병력<big class="green">+${fmt(m.replacements)}명</big></div><div class="stat">점령 지역<big>${m.gained.length}곳</big></div></div><div class="summary"><div class="row"><span>월초 병력</span><b>${fmt(m.startMen)}명</b></div><div class="row"><span class="red">전투 손실</span><b class="red">−${fmt(m.battleLoss)}명</b></div><div class="row"><span class="green">보충 병력</span><b class="green">+${fmt(m.replacements)}명</b></div><hr style="border-color:#41536b"><div class="row"><b>월말 병력</b><b>${fmt(m.endMen)}명</b></div></div></div><div class="card"><h3>⚔️ 전투 성적</h3><div class="row"><span>승리 ${m.victories}회</span><span>패배 ${m.defeats}회</span><span>방어전 ${m.defenses}회</span></div><p class="small">확보 지역: ${m.gained.length?m.gained.map(esc).join(', '):'없음'}</p><h3>🪖 부대 상태</h3><div class="row"><span>사기 ${m.startMorale} → <b class="green">${m.endMorale}</b></span><span>피로 ${m.startFatigue} → <b class="yellow">${m.endFatigue}</b></span></div></div><div class="card accent"><h3>🎖️ 군단사령부 월간 평가</h3><p>${m.victories>m.defeats?'이번 달 작전 수행 성과가 긍정적입니다. 다음 달에도 안정적으로 임무를 수행해 주십시오.':m.battleLoss>m.startMen*.15?'이번 달 병력 손실이 많았습니다. 다음 작전에서는 병력 보존에 유의해 주십시오.':'이번 달 작전 수행 상태를 확인했습니다. 다음 달에도 임무를 계속 수행해 주십시오.'}</p></div><div class="card"><h3>🌍 월간 세계 전황</h3><p class="small muted">유럽 전체 지도의 영토 변화를 확인할 수 있습니다. 실제 역사와 전황은 플레이어의 작전에 따라 달라질 수 있습니다.</p><button id="recordBtn" class="soft" style="width:100%">지난달 결산 기록 보기</button></div></div>`;$('recordBtn').onclick=()=>openModal('월간 결산 기록',S.monthlyRecords.map(r=>`<div class="resultline"><b>${monthLabel(r.key)}</b> · 병력 ${fmt(r.endMen)}명 · 승리 ${r.victories}회 · 손실 ${fmt(r.battleLoss)}명</div>`).join(''))}
function next(){if(!S)return;if(S.pendingMonth){S.pendingMonth=false;initMonth();S.stage=0;pickEvent();save();render();return}if(S.stage===0){if(S.meetingIndex<3){S.meetingIndex++;render();return}S.stage=1}else if(S.stage===1){if(!S.special){openModal('특별 행동을 선택해 주세요','<p>정찰·상부 지원 요청·지휘관 면담 중 한 가지를 선택해야 다음 장면으로 진행할 수 있습니다.</p>');return}S.stage=2;selectedRegion=null;mapMode='local'}else if(S.stage===2){if(mapMode==='world'){mapMode='local';render();return}S._mapCamera=null;prepareDialogues();S.stage=3}else if(S.stage===3){if(S.dialogues.some(d=>!d.done)){openModal('연대장의 응답이 필요합니다','<p>연대장의 건의에 대한 대응을 선택해 주십시오.</p>');return}battle();S.stage=4}else{endWeek();return}save();render()}
function previous(){if(!S||S.pendingMonth)return;if(S.stage===0){if(S.meetingIndex>0)S.meetingIndex--;render();return}if(S.stage===4)return;if(S.stage===3&&S.dialogues.some(d=>d.done))return;S.stage--;if(S.stage===0)S.meetingIndex=3;render();save()}
$('next').onclick=next;$('prev').onclick=previous;
try{const loaded=JSON.parse(localStorage.getItem(KEY));if(loaded&&loaded.version===34&&loaded.owners?.length===60&&loaded.units?.length===3){S=loaded;selectedRegion=null}}catch(e){}render();
</script></body></html>
